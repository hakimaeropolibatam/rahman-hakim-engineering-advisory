# Render Blueprint for Rahman Hakim Engineering Advisory
# Free static hosting; no database, runtime server, or paid compute required.
services:
  - type: web
    runtime: static
    name: rahman-hakim-engineering-advisory
    repo: https://github.com/hakimaeropolibatam/rahman-hakim-engineering-advisory
    branch: main
    buildCommand: mkdir -p public/assets && cp index.html public/ && cp assets/rahman-hakim-official-symbol.png public/assets/ && mkdir -p public/data && cp data/portfolio.js public/data/
    staticPublishPath: ./public
    autoDeployTrigger: commit
